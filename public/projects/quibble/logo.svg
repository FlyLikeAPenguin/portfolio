<!--
  quibble.party lettermark favicon.

  This is `.lobby-mark` (the `q.` on the host rail, LobbyRail.tsx) drawn at icon
  scale: Oswald 600 from public/fonts/oswald-600-latin.woff2, set in caps with
  letter-spacing -0.03em, in the `ch-acc` coral #e96545. (That is the CSS custom
  property, written without its leading dashes because XML forbids a double
  hyphen inside a comment.)

  No plate: the mark is knocked out of a transparent ground so it sits on
  whatever the browser's tab strip is using, light or dark. That costs contrast
  against the carbon-plate version (about 3.3:1 on a white tab and 3.7:1 on a
  dark one, versus 5.6:1 on carbon) and is a deliberate choice, not an
  oversight; both clear the 3:1 that a non-text graphic is held to. It also
  means the padding is the mark's own: with no plate to frame it the glyph runs
  nearly edge to edge, since a tab gives it 16 physical pixels and no margin.

  apple-touch-icon.png is the exception and KEEPS the carbon plate. iOS
  composites a transparent home-screen icon onto pure black, which is not this
  palette's carbon, so a transparent one would put an off-palette near-black
  square on the home screen rather than no square at all.

  The glyphs are OUTLINED, not <text>: a favicon renders outside the page, where
  neither the @font-face nor the custom properties exist, so anything that
  referenced them would silently fall back to the browser's default face.
  Regenerate by re-extracting the Q and period outlines from that woff2 if the
  display face ever changes; the face is the `ch-display` token in src/styles.css.
-->
